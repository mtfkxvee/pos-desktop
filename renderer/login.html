<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NursaPOS — Login</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        /* left-anchored: the window is more square than the (landscape)
           source image, so `cover` must crop somewhere — anchoring left
           keeps the logo/wordmark fully visible and trims the illustration
           side instead, which tolerates cropping much better. */
        background: url("../build/Code_Generated_Image.jpg") left center / cover no-repeat;
        display: flex;
        align-items: flex-end;
      }

      /* Login card sits in the empty lower-left area of the background
         artwork (below the X-Sha logo, left of the illustration group). */
      #login-card {
        margin-left: 6%;
        margin-bottom: 8%;
        width: 340px;
        max-width: 90vw;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        border-radius: 16px;
        padding: 1.75rem 1.75rem 1.5rem;
        box-shadow: 0 12px 32px rgba(80, 40, 120, 0.18);
      }

      h2 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
        color: #3d1f5c;
      }
      #subtitle {
        margin: 0 0 0.75rem;
        color: #6b6b6b;
        font-size: 0.82rem;
      }

      label {
        display: block;
        margin-top: 0.65rem;
        font-size: 0.82rem;
        color: #444;
        font-weight: 500;
      }
      input {
        width: 100%;
        padding: 0.55rem 0.65rem;
        margin-top: 0.25rem;
        box-sizing: border-box;
        border: 1.5px solid #ddd4e8;
        border-radius: 8px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input:focus {
        border-color: #8b4fc7;
      }

      .password-field {
        position: relative;
        margin-top: 0.25rem;
      }
      .password-field input {
        margin-top: 0;
        padding-right: 2.25rem;
      }
      .password-toggle {
        position: absolute;
        right: 0.4rem;
        top: 50%;
        transform: translateY(-50%);
        width: 1.6rem;
        height: 1.6rem;
        padding: 0;
        margin: 0;
        border: none;
        background: transparent;
        color: #8a8a8a;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
      }
      .password-toggle:hover {
        color: #5f2f96;
        background: rgba(139, 79, 199, 0.1);
        opacity: 1;
      }
      .password-toggle svg {
        width: 1.1rem;
        height: 1.1rem;
      }

      button {
        margin-top: 1.25rem;
        padding: 0.65rem 1rem;
        width: 100%;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #8b4fc7, #5f2f96);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:hover { opacity: 0.92; }
      button:active { opacity: 0.85; }

      #msg {
        margin-top: 0.85rem;
        font-size: 0.82rem;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      #msg.error { color: #b00020; }
      #msg.success { color: #146c2e; }

      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="login-card">
      <h2 id="title">Login Kasir</h2>
      <p id="subtitle"></p>

      <form id="login-form">
        <div id="setup-fields" class="hidden">
          <label>Server URL (mis. https://erp.contoh.com)
            <input type="text" name="baseUrl" />
          </label>
          <label>Kode Outlet (mis. JKT01)
            <input type="text" name="outletCode" />
          </label>
          <label>POS Profile Default
            <input type="text" name="posProfile" />
          </label>
        </div>

        <label>Username / Email
          <input type="text" name="usr" required autofocus />
        </label>
        <label>Password
          <div class="password-field">
            <input type="password" name="pwd" id="pwd-input" required />
            <button type="button" class="password-toggle" id="pwd-toggle" aria-label="Tampilkan password" title="Tampilkan password">
              <svg id="pwd-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg id="pwd-icon-hide" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a21.3 21.3 0 015.17-6.17M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a21.3 21.3 0 01-3.22 4.44M14.12 14.12a3 3 0 11-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </label>
        <button type="submit">Login</button>
      </form>
      <div id="msg"></div>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const msg = document.getElementById("msg");
      const setupFields = document.getElementById("setup-fields");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");

      const pwdInput = document.getElementById("pwd-input");
      const pwdToggle = document.getElementById("pwd-toggle");
      const pwdIconShow = document.getElementById("pwd-icon-show");
      const pwdIconHide = document.getElementById("pwd-icon-hide");

      pwdToggle.addEventListener("click", () => {
        const showing = pwdInput.type === "text";
        pwdInput.type = showing ? "password" : "text";
        pwdIconShow.classList.toggle("hidden", !showing);
        pwdIconHide.classList.toggle("hidden", showing);
        const label = showing ? "Tampilkan password" : "Sembunyikan password";
        pwdToggle.setAttribute("aria-label", label);
        pwdToggle.title = label;
      });

      let deviceConfigured = false;

      async function init() {
        try {
          const res = await fetch("http://127.0.0.1:8871/auth/status");
          const status = await res.json();
          deviceConfigured = !!status.configured;

          if (deviceConfigured) {
            title.textContent = "Login Kasir";
            subtitle.textContent = "Masukkan username dan password Anda.";
            setupFields.classList.add("hidden");
            for (const el of setupFields.querySelectorAll("input")) el.required = false;
          } else {
            title.textContent = "Setup Device — Login Pertama Kali";
            subtitle.textContent = "Butuh koneksi internet. Data ini disimpan sekali untuk device ini.";
            setupFields.classList.remove("hidden");
            for (const el of setupFields.querySelectorAll("input")) el.required = true;
          }
        } catch (err) {
          msg.className = "error";
          msg.textContent = "Tidak bisa menghubungi local server: " + err.message;
        }
      }
      init();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "";
        msg.textContent = "Memproses login...";

        const data = Object.fromEntries(new FormData(form).entries());
        try {
          const res = await fetch("http://127.0.0.1:8871/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const json = await res.json();
          if (!res.ok || !json.ok) {
            throw new Error(json.error || "Login gagal");
          }
          msg.className = "success";
          msg.textContent = "Login berhasil sebagai " + json.username + ". Membuka aplikasi kasir...";
          window.posDesktop.notifyLoginComplete();
        } catch (err) {
          msg.className = "error";
          msg.textContent = "Error: " + err.message;
        }
      });
    </script>
  </body>
</html>
