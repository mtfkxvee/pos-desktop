# electron-builder config for NursaPOS.
#
# appId is deliberately NOT "renamed" alongside productName below — it's
# what electron-updater/NSIS use to recognize "this is the same app, just a
# newer version" across releases, and (separately) main/index.js's
# app.setName("pos-desktop") — not productName — is what decides
# app.getPath("userData"). Changing either would make already-installed
# outlets look like a fresh, unconfigured device after their next update
# (old local DB/credentials still on disk, just under a folder name the
# app stops looking in). productName only affects the installer file name,
# Start Menu entry, and window title — safe to change on its own.
#
# Per-outlet builds: override productName/appId via env vars before building,
# e.g.:
#   POS_PRODUCT_NAME="POS Kasir - Toko Jakarta" POS_APP_ID="id.nursa.pos.jkt01" npm run dist
#
# Defaults — override per-outlet at build time via CLI flags instead of env
# vars (electron-builder.yml doesn't support env-var fallback syntax
# reliably across versions). See docs/PACKAGING.md for the exact command:
#   npx electron-builder --win -c.appId=... -c.productName="..."
appId: id.nursa.pos.desktop
productName: NursaPOS
copyright: Copyright © 2026

directories:
  output: dist-installer
  buildResources: build

files:
  - main/**/*
  - server/**/*
  - renderer/dist/**/*
  - renderer/login.html
  - build/icon.png
  - build/Code_Generated_Image.jpg
  - package.json
  - "!renderer/src/**/*"
  - "!renderer/node_modules/**/*"
  - "!renderer/index.html"
  - "!**/*.map"

extraResources: []

# Auto-update feed (see main/index.js's autoUpdater wiring). GitHub Releases
# as the provider — electron-updater reads this repo's latest published
# Release for a matching .exe + its auto-generated latest.yml. Requires the
# repo to be public (or GH_TOKEN set at build/runtime for a private one —
# NOT done here deliberately: baking a token into an app handed out to
# outlets means anyone with the installer can extract and reuse it).
publish:
  provider: github
  owner: mtfkxvee
  repo: pos-desktop

# SQLite DB file, credentials, and device config live in userData — never
# touched by the installer/uninstaller.
#
# No native .node binaries ship with the app anymore (printing is done via
# node-thermal-printer, pure JS + PowerShell RAW-print, see main/printer.js)
# — this stays as a defensive default in case a future native dep is added.
#
# main/*.ps1 must also be unpacked: they're invoked via execFile("powershell.exe",
# ["-File", ...]) — an external process that can't read files packed inside
# app.asar (only Electron/Node's own patched fs can see into that archive).
# Without this, printing silently breaks in every packaged build (works fine
# in dev, where nothing is asar-packed) — see main/printer.js's scriptPath().
asarUnpack:
  - "**/*.node"
  - "main/*.ps1"

win:
  target:
    - target: nsis
      arch:
        - x64
  # NursaPOS logo — electron-builder auto-generates the multi-resolution
  # .ico from this 500x500 PNG at build time (no manual conversion needed).
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # No spaces in the built filename, deliberately — GitHub Releases renames
  # spaces in an uploaded asset's name to periods ("My App.exe" ->
  # "My.App.exe"), but electron-updater's own GitHubProvider.resolveFiles()
  # renames spaces in latest.yml's filename to hyphens when building the
  # download URL (see node_modules/electron-updater/out/providers/
  # GitHubProvider.js — "still replace space to - due to backward
  # compatibility"). Those two don't agree, so an installer name with
  # spaces in it 404s on auto-update every single release. Default
  # electron-builder artifactName is "${productName} Setup ${version}.${ext}"
  # — the literal " Setup " is what introduced the spaces here, independent
  # of productName itself already being one word.
  artifactName: "${productName}-Setup-${version}.${ext}"

# Each outlet's build gets a distinct appId/productName (see env vars above),
# so installs on different outlet machines never collide, and Windows treats
# them as separate applications (separate Start Menu entry, separate
# userData folder derived from productName).
