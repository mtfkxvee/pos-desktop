# electron-builder config for POS Desktop.
#
# Per-outlet builds: override productName/appId via env vars before building,
# e.g.:
#   POS_PRODUCT_NAME="POS Kasir - Toko Jakarta" POS_APP_ID="id.nursa.pos.jkt01" npm run dist
#
# Defaults — override per-outlet at build time via CLI flags instead of env
# vars (electron-builder.yml doesn't support env-var fallback syntax
# reliably across versions). See docs/PACKAGING.md for the exact command:
#   npx electron-builder --win -c.appId=... -c.productName="..."
appId: id.nursa.pos.desktop
productName: POS Desktop
copyright: Copyright © 2026

directories:
  output: dist-installer
  buildResources: build

files:
  - main/**/*
  - server/**/*
  - renderer/dist/**/*
  - renderer/login.html
  - build/icon.png
  - build/Code_Generated_Image.jpg
  - package.json
  - "!renderer/src/**/*"
  - "!renderer/node_modules/**/*"
  - "!renderer/index.html"
  - "!**/*.map"

extraResources: []

# Auto-update feed (see main/index.js's autoUpdater wiring). GitHub Releases
# as the provider — electron-updater reads this repo's latest published
# Release for a matching .exe + its auto-generated latest.yml. Requires the
# repo to be public (or GH_TOKEN set at build/runtime for a private one —
# NOT done here deliberately: baking a token into an app handed out to
# outlets means anyone with the installer can extract and reuse it).
publish:
  provider: github
  owner: mtfkxvee
  repo: pos-desktop

# SQLite DB file, credentials, and device config live in userData — never
# touched by the installer/uninstaller.
#
# No native .node binaries ship with the app anymore (printing is done via
# node-thermal-printer, pure JS + PowerShell RAW-print, see main/printer.js)
# — this stays as a defensive default in case a future native dep is added.
asarUnpack:
  - "**/*.node"

win:
  target:
    - target: nsis
      arch:
        - x64
  # NURSA POS logo — electron-builder auto-generates the multi-resolution
  # .ico from this 500x500 PNG at build time (no manual conversion needed).
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Each outlet's build gets a distinct appId/productName (see env vars above),
# so installs on different outlet machines never collide, and Windows treats
# them as separate applications (separate Start Menu entry, separate
# userData folder derived from productName).
